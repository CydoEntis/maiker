[package]
name = "maiker"
version = "0.80.0"
edition = "2024"
description = "All agents on deck: run many coding agents side by side, see which need you, keep them running when you leave"
license = "MIT"
build = "build.rs"

# The app's brand-dependent names live here and nowhere else (ADR 0008, 0012): the package name
# above is the command, and build.rs hands these to the code as APP_NAME, APP_TAGLINE, APP_COMMAND,
# APP_PREVIOUS, APP_DAEMON, APP_DAEMON_PREVIOUS, APP_ENV and APP_ENV_PREVIOUS (read through
# `maitty_shared::brand`). `env_prefix` is brand-free on purpose: a rename leaves it alone.
[package.metadata.brand]
name = "Maiker"
tagline = "All agents on deck"
previous = ["maitty", "vibecasso", "seshi", "hydra", "drover"]
daemon = "maikerd"
daemon_previous = ["maitty-gui-daemon"]
env_prefix = "AGENT"
env_previous = ["MAITTY"]

[lib]
name = "runtime"
test = true
doctest = false

[dependencies]
maitty-terminal-client = { path = "../../crates/maitty-terminal-client" }

[dev-dependencies]
maitty-shared = { path = "../../crates/maitty-shared" }
maitty-test-support = { path = "../../crates/maitty-test-support" }
tokio = { version = "1", features = ["rt", "time", "macros"] }
